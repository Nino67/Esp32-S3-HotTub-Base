<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hot Tub Controller</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <!-- Fetch the module graph in parallel instead of discovering imports one level at a time. -->
    <link rel="modulepreload" href="/js/app.js" />
    <link rel="modulepreload" href="/js/chart_manager.js" />
    <link rel="modulepreload" href="/js/globals.js" />
    <link rel="modulepreload" href="/js/callbacks.js" />
    <link rel="modulepreload" href="/js/communication/crc32_wrapper.js" />
    <link rel="modulepreload" href="/js/communication/ws_manager.js" />
    <link rel="modulepreload" href="/js/communication/callback_manager.js" />
    <link rel="modulepreload" href="/js/communication/message_parser.js" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="center-display-wrap">
          <p class="eyebrow">Hot Tub Controller</p>
          <div class="temperature-display" id="filteredTemperature">--°C</div>
          <div class="temperature-label">Water Temperature</div>
        </div>
      </section>

      <!-- Controls -->
      <section class="panel" id="controlsPanel">
        <div class="controls-stack">
          <label class="toggle-row" for="heatToggle">
            <span class="switch-label">Heat Mode</span>
            <span class="switch-control">
              <input id="heatToggle" type="checkbox" class="switch-input" />
              <span class="switch-track">
                <span class="switch-thumb"></span>
              </span>
            </span>
          </label>

          <label class="toggle-row" for="settingsToggle">
            <span class="switch-label">Settings</span>
            <span class="switch-control">
              <input id="settingsToggle" type="checkbox" class="switch-input" />
              <span class="switch-track">
                <span class="switch-thumb"></span>
              </span>
            </span>
          </label>

          <div class="pump-row">
            <span class="switch-label pump-label">Pump</span>
            <div class="pump-selector" role="radiogroup" aria-label="Pump mode">
              <div class="pump-track">
                <input id="pumpOff" type="radio" name="pumpMode" value="0" checked />
                <label for="pumpOff" class="pump-segment">Off</label>

                <input id="pumpLow" type="radio" name="pumpMode" value="1" />
                <label for="pumpLow" class="pump-segment">Low</label>

                <input id="pumpHigh" type="radio" name="pumpMode" value="2" />
                <label for="pumpHigh" class="pump-segment">Hi</label>

                <span class="pump-thumb"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <header>
          <h2>Temperature Plot</h2>
        </header>
        <p id="chartStatus" role="status">Waiting for live data</p>
        <div id="chartContainer" class="chart-placeholder">
        </div>
      </section>



      <section class="panel" id="settingsPanel" hidden aria-hidden="true">
        <header>
          <h2>Settings</h2>
        </header>
        <div class="controls-stack">
          <div id="settingsFields" class="settings-fields">
            <label class="toggle-row" for="tempUnitSelect">
              <span class="switch-label">Temp Unit</span>
              <select id="tempUnitSelect">
                <option value="celsius">°C</option>
                <option value="fahrenheit">°F</option>
              </select>
            </label>

            <label class="toggle-row" for="setpointTempInput">
              <span class="switch-label">Setpoint</span>
              <input id="setpointTempInput" type="number" step="0.1" placeholder="°C" />
            </label>

            <label class="toggle-row" for="lowPassFilterAlphaInput">
              <span class="switch-label">Low Pass α</span>
              <input id="lowPassFilterAlphaInput" type="number" step="0.01" min="0" max="1" placeholder="0.00" />
            </label>

            <label class="toggle-row" for="highHysteresisInput">
              <span class="switch-label">High Hyst.</span>
              <input id="highHysteresisInput" type="number" step="0.1" placeholder="°C" />
            </label>
            
            <label class="toggle-row" for="lowHysteresisInput">
              <span class="switch-label">Low Hyst.</span>
              <input id="lowHysteresisInput" type="number" step="0.1" placeholder="°C" />
            </label>
            
            <label class="toggle-row" for="pumpPreRunTimeInput">
              <span class="switch-label">Pump Pre-Run</span>
              <input id="pumpPreRunTimeInput" type="number" step="1" min="0" placeholder="sec" />
            </label>
            
            <label class="toggle-row" for="pumpPostRunTimeInput">
              <span class="switch-label">Pump Post-Run</span>
              <input id="pumpPostRunTimeInput" type="number" step="1" min="0" placeholder="sec" />
            </label>
            
            <br />
            <br />
            <br />

            <h2>Over The Air Update</h2>
            <button id="otaBtn" class="secondary">OTA Update</button>
            <!-- <button id="otaManifestBtn" class="secondary">OTA Manifest</button> -->
            <div class="ota-status-panel">
              <div class="ota-status-row">
                <strong>OTA status</strong>
                <span id="otaStatus">idle</span>
              </div>
              <div class="progress">
                <div id="otaProgressBar" class="progress__bar">0%</div>
              </div>
            </div>
          </div>
        </div>
        <br />
        <br />
        <br />
        <section class="panel" id="debugPanel">
          <div class="debug-row">
            <label class="toggle-row" for="statusPayloadBlockToggle">
              <span class="switch-label">Status display</span>
              <span class="switch-control">
                <input id="statusPayloadBlockToggle" type="checkbox" class="switch-input" checked />
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>
            <br />
            <label class="toggle-row" for="receivePayloadToggle">
              <span class="switch-label">Last received payload</span>
              <span class="switch-control">
                <input id="receivePayloadToggle" type="checkbox" class="switch-input" checked />
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>

            <pre id="receiveView">waiting for response...</pre>
            <div class="debug-send-row">
              <label class="debug-send-label">Send JSON</label>
              <textarea id="debugSendInput" spellcheck="false" placeholder='{"id":1,"type":"req","cmd":"hottub.automode.set","params":{"auto.mode":true}}'></textarea>
              <div class="debug-send-actions">
                <button id="debugSendButton" class="secondary">Send</button>
                <span id="debugSendStatus" class="muted">&nbsp;</span>
              </div>
            </div>
          </div>
          <div id="debugActions" class="debug-actions">
            <button id="clearReceiveViewButton">Clear Receive View</button>
            <button id="sendSystemStatusBtn">System Status</button>
          </div>
        </section>

      </section>


      <!--       
      <section class="panel">
        <header>
          <h2>Status</h2>
        </header>
        <pre id="stateView">waiting for state...</pre>
      </section>
       -->

    </main>

    <script src="/vendor/uPlot.iife.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
